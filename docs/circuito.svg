<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="980" height="560" fill="#ffffff"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- PC -->
  <rect x="30" y="40" width="150" height="80" rx="8" fill="#eef2f7" stroke="#445"/>
  <text x="105" y="70" text-anchor="middle" font-weight="bold">Computador</text>
  <text x="105" y="90" text-anchor="middle" font-size="11">painel.py (interface)</text>
  <text x="105" y="106" text-anchor="middle" font-size="11">projeto/*.py</text>

  <!-- Nano -->
  <rect x="250" y="30" width="200" height="330" rx="8" fill="#e8e4f4" stroke="#536"/>
  <text x="350" y="56" text-anchor="middle" font-weight="bold">Nano LGT8F328P</text>
  <text x="350" y="73" text-anchor="middle" font-size="11">16 MHz · ADC 12 bits</text>
  <g font-size="12">
    <text x="440" y="110" text-anchor="end">D10 (OC1B) PWM +</text>
    <text x="440" y="140" text-anchor="end">D9 (OC1A) PWM −</text>
    <text x="440" y="200" text-anchor="end">D2 (INT0) enc. A</text>
    <text x="440" y="230" text-anchor="end">D3 (INT1) enc. B</text>
    <text x="440" y="290" text-anchor="end">A6 potenciômetro</text>
    <text x="260" y="320">5V</text>
    <text x="260" y="345">GND</text>
    <text x="260" y="85">USB</text>
  </g>
  <line x1="180" y1="80" x2="250" y2="80" stroke="#333" stroke-width="2" marker-end="url(#seta)" marker-start="url(#seta)"/>
  <text x="215" y="72" text-anchor="middle" font-size="10">serial 115200</text>

  <!-- H bridge -->
  <rect x="560" y="70" width="160" height="110" rx="8" fill="#fbeee2" stroke="#a62"/>
  <text x="640" y="95" text-anchor="middle" font-weight="bold">Ponte H</text>
  <text x="640" y="112" text-anchor="middle" font-size="11">(ex.: L298N)</text>
  <text x="570" y="137" font-size="11">IN1</text><text x="570" y="160" font-size="11">IN2</text>
  <text x="712" y="137" font-size="11" text-anchor="end">OUT1</text><text x="712" y="160" font-size="11" text-anchor="end">OUT2</text>
  <line x1="450" y1="106" x2="520" y2="106" stroke="#a62" stroke-width="2"/>
  <line x1="520" y1="106" x2="520" y2="133" stroke="#a62" stroke-width="2"/>
  <line x1="520" y1="133" x2="560" y2="133" stroke="#a62" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="450" y1="136" x2="505" y2="136" stroke="#a62" stroke-width="2"/>
  <line x1="505" y1="136" x2="505" y2="156" stroke="#a62" stroke-width="2"/>
  <line x1="505" y1="156" x2="560" y2="156" stroke="#a62" stroke-width="2" marker-end="url(#seta)"/>

  <!-- 12V supply -->
  <rect x="780" y="20" width="160" height="44" rx="8" fill="#fdf6d8" stroke="#a80"/>
  <text x="860" y="47" text-anchor="middle" font-weight="bold">Fonte 12 V</text>
  <line x1="800" y1="64" x2="800" y2="90" stroke="#c00" stroke-width="2"/>
  <line x1="800" y1="90" x2="720" y2="90" stroke="#c00" stroke-width="2"/>
  <text x="760" y="84" text-anchor="middle" font-size="10" fill="#c00">+12 V</text>

  <!-- Motor + encoder -->
  <circle cx="830" cy="200" r="48" fill="#e3f1e6" stroke="#273"/>
  <text x="830" y="196" text-anchor="middle" font-weight="bold">Motor DC</text>
  <text x="830" y="213" text-anchor="middle" font-size="11">τ ≈ 20 ms</text>
  <line x1="720" y1="133" x2="790" y2="170" stroke="#273" stroke-width="2"/>
  <line x1="720" y1="156" x2="785" y2="195" stroke="#273" stroke-width="2"/>
  <rect x="770" y="265" width="120" height="60" rx="6" fill="#e3f1e6" stroke="#273"/>
  <text x="830" y="290" text-anchor="middle" font-weight="bold">Encoder</text>
  <text x="830" y="307" text-anchor="middle" font-size="11">32 pulsos/volta</text>
  <line x1="830" y1="248" x2="830" y2="265" stroke="#273" stroke-width="5"/>
  <text x="840" y="260" font-size="10">eixo</text>
  <line x1="770" y1="285" x2="560" y2="285" stroke="#06c" stroke-width="2"/>
  <line x1="560" y1="285" x2="560" y2="196" stroke="#06c" stroke-width="2"/>
  <line x1="560" y1="196" x2="450" y2="196" stroke="#06c" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="770" y1="305" x2="540" y2="305" stroke="#06c" stroke-width="2"/>
  <line x1="540" y1="305" x2="540" y2="226" stroke="#06c" stroke-width="2"/>
  <line x1="540" y1="226" x2="450" y2="226" stroke="#06c" stroke-width="2" marker-end="url(#seta)"/>
  <text x="660" y="280" font-size="11" fill="#06c" text-anchor="middle">canal A</text>
  <text x="660" y="320" font-size="11" fill="#06c" text-anchor="middle">canal B (90° defasado)</text>

  <!-- Pot -->
  <rect x="490" y="380" width="120" height="40" rx="6" fill="#f2f2f2" stroke="#555"/>
  <text x="550" y="405" text-anchor="middle" font-weight="bold">Potenciômetro</text>
  <line x1="490" y1="400" x2="470" y2="400" stroke="#555" stroke-width="2"/>
  <line x1="470" y1="400" x2="470" y2="286" stroke="#555" stroke-width="2"/>
  <line x1="470" y1="286" x2="450" y2="286" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <text x="430" y="410" text-anchor="end" font-size="11">cursor → A6, pontas em 5 V e GND</text>

  <!-- GND common -->
  <line x1="290" y1="345" x2="290" y2="470" stroke="#000" stroke-width="2"/>
  <line x1="290" y1="470" x2="900" y2="470" stroke="#000" stroke-width="2"/>
  <line x1="640" y1="180" x2="640" y2="470" stroke="#000" stroke-width="2"/>
  <line x1="900" y1="64" x2="900" y2="470" stroke="#000" stroke-width="2"/>
  <line x1="880" y1="325" x2="880" y2="470" stroke="#000" stroke-width="2"/>
  <text x="595" y="490" text-anchor="middle" font-weight="bold">GND comum (Nano, ponte H, fonte, encoder) — obrigatório</text>
  <line x1="300" y1="320" x2="320" y2="320" stroke="#c00" stroke-width="2"/>
  <text x="325" y="324" font-size="10" fill="#c00">5 V → encoder e potenciômetro</text>

  <text x="30" y="530" font-size="11" fill="#555">Pinagem extraída do firmware original (engenharia reversa). Modelo da ponte H e ligação do potenciômetro: conferir na bancada.</text>
</svg>
