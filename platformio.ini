; Bancada de controle de motor DC - bancada nº 5
; Placa: Nano roxo com LGT8F328P (clone do ATmega328P), bootloader a 57600 baud
[env:lgt8f328p]
platform = darkautism/lgt8f
board = LGT8F328P
framework = arduino
board_build.f_cpu = 16000000L
upload_port = /dev/ttyACM1
upload_speed = 57600
monitor_port = /dev/ttyACM1
monitor_speed = 115200
lib_deps = paulstoffregen/TimerOne@^1.2
